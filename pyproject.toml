[project]
name = "longhorns"
version = "0.1.0"
description = "Films and TV adapted from journalism: seed lists → archive → Wikidata/IMDb → Haiku classification."
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28",
    "selectolax>=0.3",
    "baml-bridge==0.17.0",
    "pydantic>=2",
    "python-dotenv>=1.0",
    "curl-cffi>=0.16.3",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.9",
]

[tool.uv]
package = false
python-preference = "only-managed"

[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = ["baml_sdk"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"steps/export.py" = ["E501"]  # embedded HTML/CSS template

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
